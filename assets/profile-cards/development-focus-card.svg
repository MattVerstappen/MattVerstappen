<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
  <title id="title">Development Focus profile card</title>
  <desc id="desc">Local profile card showing Matt Verstappen's development focus areas</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100a1f"/>
      <stop offset="0.55" stop-color="#17102b"/>
      <stop offset="1" stop-color="#080713"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="0.52" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.58 0 0 0 0 0 0.20 0 0 0 0 0 0.92 0 0 0 0 0 0.55 0" result="purpleBlur"/>
      <feMerge>
        <feMergeNode in="purpleBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="840" height="280" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="836" height="276" rx="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="720" cy="48" r="76" fill="#9333ea" opacity="0.15" filter="url(#glow)"/>
  <circle cx="88" cy="238" r="86" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>
  <rect x="34" y="32" width="138" height="30" rx="15" fill="#211336" stroke="#9333ea" stroke-opacity="0.75"/>
  <text x="103" y="52" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PROFILE CARD</text>
  <text x="34" y="108" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Development Focus</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f4efff">
    <text x="62" y="156">Unity Game Development</text>
    <text x="62" y="190">C# Systems &amp; Tooling</text>
    <text x="62" y="224">Interactive UI/UX</text>
    <text x="458" y="156">Creative Web Projects</text>
  </g>
  <g fill="url(#accent)">
    <circle cx="42" cy="149" r="6"/>
    <circle cx="42" cy="183" r="6"/>
    <circle cx="42" cy="217" r="6"/>
    <circle cx="438" cy="149" r="6"/>
  </g>
</svg>
