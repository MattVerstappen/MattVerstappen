<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
  <title id="title">Core Tech Stack profile card</title>
  <desc id="desc">Local profile card showing Matt Verstappen's core technology stack</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100a1f"/>
      <stop offset="0.55" stop-color="#17102b"/>
      <stop offset="1" stop-color="#080713"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="0.52" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#00d26a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.58 0 0 0 0 0 0.20 0 0 0 0 0 0.92 0 0 0 0 0 0.55 0" result="purpleBlur"/>
      <feMerge>
        <feMergeNode in="purpleBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="840" height="280" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="836" height="276" rx="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="720" cy="50" r="78" fill="#c026d3" opacity="0.14" filter="url(#glow)"/>
  <circle cx="86" cy="238" r="84" fill="#00d26a" opacity="0.08" filter="url(#glow)"/>
  <rect x="34" y="32" width="118" height="30" rx="15" fill="#211336" stroke="#c026d3" stroke-opacity="0.75"/>
  <text x="93" y="52" text-anchor="middle" fill="#f5d0fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">STACK MAP</text>
  <text x="34" y="108" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Core Tech Stack</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="34" y="136" width="86" height="34" rx="17" fill="#2a1740" stroke="#9333ea" stroke-opacity="0.8"/>
    <text x="77" y="158" text-anchor="middle" fill="#f5e8ff">Unity</text>
    <rect x="132" y="136" width="60" height="34" rx="17" fill="#2a1740" stroke="#c026d3" stroke-opacity="0.8"/>
    <text x="162" y="158" text-anchor="middle" fill="#f5e8ff">C#</text>
    <rect x="204" y="136" width="72" height="34" rx="17" fill="#2a1740" stroke="#00d26a" stroke-opacity="0.75"/>
    <text x="240" y="158" text-anchor="middle" fill="#f5e8ff">WPF</text>
    <rect x="288" y="136" width="80" height="34" rx="17" fill="#2a1740" stroke="#9333ea" stroke-opacity="0.8"/>
    <text x="328" y="158" text-anchor="middle" fill="#f5e8ff">HTML</text>
    <rect x="380" y="136" width="70" height="34" rx="17" fill="#2a1740" stroke="#c026d3" stroke-opacity="0.8"/>
    <text x="415" y="158" text-anchor="middle" fill="#f5e8ff">CSS</text>
    <rect x="34" y="188" width="122" height="34" rx="17" fill="#2a1740" stroke="#00d26a" stroke-opacity="0.75"/>
    <text x="95" y="210" text-anchor="middle" fill="#f5e8ff">JavaScript</text>
    <rect x="168" y="188" width="146" height="34" rx="17" fill="#2a1740" stroke="#9333ea" stroke-opacity="0.8"/>
    <text x="241" y="210" text-anchor="middle" fill="#f5e8ff">GitHub Pages</text>
  </g>
</svg>
