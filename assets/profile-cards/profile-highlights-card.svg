<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
  <title id="title">Profile Highlights profile card</title>
  <desc id="desc">Local profile card showing Matt Verstappen's profile highlights</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100a1f"/>
      <stop offset="0.55" stop-color="#17102b"/>
      <stop offset="1" stop-color="#080713"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.58 0 0 0 0 0 0.20 0 0 0 0 0 0.92 0 0 0 0 0 0.55 0" result="purpleBlur"/>
      <feMerge>
        <feMergeNode in="purpleBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="840" height="280" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="836" height="276" rx="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="720" cy="50" r="78" fill="#f472b6" opacity="0.13" filter="url(#glow)"/>
  <circle cx="86" cy="238" r="84" fill="#9333ea" opacity="0.12" filter="url(#glow)"/>
  <rect x="34" y="32" width="128" height="30" rx="15" fill="#211336" stroke="#c026d3" stroke-opacity="0.75"/>
  <text x="98" y="52" text-anchor="middle" fill="#f5d0fe" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">HIGHLIGHTS</text>
  <text x="34" y="108" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Profile Highlights</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f4efff">
    <text x="62" y="156">Game Developer</text>
    <text x="62" y="190">Portfolio Builder</text>
    <text x="62" y="224">Research Graduate</text>
    <text x="420" y="156">Open to Opportunities</text>
  </g>
  <g fill="url(#accent)">
    <path d="M38 143l8 8 16-18" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 177l8 8 16-18" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 211l8 8 16-18" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M396 143l8 8 16-18" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
