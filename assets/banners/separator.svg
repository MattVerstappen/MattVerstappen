<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 42" role="img" aria-label="Neon separator">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="42" fill="#000000"/>
  <line x1="80" y1="21" x2="1520" y2="21" stroke="url(#g)" stroke-width="4" filter="url(#f)"/>
  <circle cx="800" cy="21" r="5" fill="#22d3ee" filter="url(#f)"/>
</svg>

