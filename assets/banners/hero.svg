<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-label="Cyberpunk hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#12081f"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="360" fill="url(#bg)"/>

  <g opacity="0.45">
    <path d="M0 82h1600" stroke="#22d3ee" stroke-width="1"/>
    <path d="M0 278h1600" stroke="#22d3ee" stroke-width="1"/>
    <path d="M85 0v360" stroke="#8b5cf6" stroke-width="1"/>
    <path d="M1515 0v360" stroke="#8b5cf6" stroke-width="1"/>
  </g>

  <text x="800" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" fill="#ffffff" filter="url(#glow)">MATTHEW DEREK RALL</text>
  <text x="800" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#c4b5fd">INDIE GAME DEVELOPER  |  PROGRAMMER</text>
</svg>
