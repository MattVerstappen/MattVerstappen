<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-label="Matthew Derek Rall — Game Developer and Designer">
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0D0A14"/>
      <stop offset="55%"  stop-color="#1A1025"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#9333EA" stroke-width="0.6" opacity="0.07"/>
    </pattern>

    <!-- Glow filter — normal -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter — strong (for pulsing layer) -->
    <filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* Name glow pulse: blurred purple shadow breathes in/out */
      @keyframes nameGlowPulse {
        0%, 100% { opacity: 0.35; }
        50%       { opacity: 0.85; }
      }

      /* Scan line sweeps top-to-bottom, loops every 4 s */
      @keyframes scanLine {
        0%   { transform: translateY(-4px); opacity: 0; }
        3%   { opacity: 0.18; }
        97%  { opacity: 0.18; }
        100% { transform: translateY(364px); opacity: 0; }
      }

      /* Subtitle glitch: fires once every 7 s, bursts across 6 frames */
      @keyframes subtitleGlitch {
        0%,  85%, 100% { transform: translateX(0);   opacity: 1.0; }
        86%             { transform: translateX(-5px); opacity: 0.65; }
        87%             { transform: translateX( 5px); opacity: 0.85; }
        88%             { transform: translateX(-3px); opacity: 0.55; }
        89%             { transform: translateX( 3px); opacity: 0.90; }
        90%             { transform: translateX(-1px); opacity: 0.75; }
        91%             { transform: translateX( 0);   opacity: 1.0;  }
      }

      .name-glow-layer {
        animation: nameGlowPulse 3.2s ease-in-out infinite;
      }
      .scan-line {
        animation: scanLine 4s linear infinite;
      }
      .subtitle {
        transform-box: fill-box;
        transform-origin: center;
        animation: subtitleGlitch 7s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="360" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="1600" height="360" fill="url(#grid)"/>

  <!-- Horizontal rule lines -->
  <g opacity="0.40">
    <line x1="0" y1="82"  x2="1600" y2="82"  stroke="#C026D3" stroke-width="1"/>
    <line x1="0" y1="278" x2="1600" y2="278" stroke="#C026D3" stroke-width="1"/>
  </g>

  <!-- Vertical rule lines -->
  <g opacity="0.40">
    <line x1="85"   y1="0" x2="85"   y2="360" stroke="#9333EA" stroke-width="1"/>
    <line x1="1515" y1="0" x2="1515" y2="360" stroke="#9333EA" stroke-width="1"/>
  </g>

  <!-- Corner accent brackets -->
  <g stroke="#9333EA" stroke-width="2.5" fill="none" opacity="0.75">
    <polyline points="18,18 18,52 52,52"/>
    <polyline points="1582,18 1582,52 1548,52"/>
    <polyline points="18,342 18,308 52,308"/>
    <polyline points="1582,342 1582,308 1548,308"/>
  </g>

  <!-- Small bracket labels -->
  <text x="60"   y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9333EA" opacity="0.55" letter-spacing="2">MDR</text>
  <text x="1480" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9333EA" opacity="0.55" letter-spacing="2" text-anchor="end">2025</text>

  <!-- Scan line (animated) -->
  <rect class="scan-line" x="0" y="-4" width="1600" height="3" fill="#C026D3" opacity="0"/>

  <!-- Name — pulsing glow layer (blurred purple copy behind the white text) -->
  <text class="name-glow-layer"
        x="800" y="172"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="68"
        font-weight="700"
        fill="#9333EA"
        filter="url(#glow-strong)"
        opacity="0.35">MATTHEW DEREK RALL</text>

  <!-- Name — main text -->
  <text x="800" y="172"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="68"
        font-weight="700"
        fill="#F1E8FF"
        filter="url(#glow)">MATTHEW DEREK RALL</text>

  <!-- Subtitle (glitch animation) -->
  <text class="subtitle"
        x="800" y="234"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        font-weight="400"
        fill="#C026D3"
        letter-spacing="5">GAME DEVELOPER  ·  DESIGNER  ·  RESEARCHER</text>
</svg>
