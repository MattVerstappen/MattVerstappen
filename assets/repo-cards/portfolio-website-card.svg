<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio Website repository card</title>
  <desc id="desc">Custom repository card for MattVerstappen/mattverstappen.github.io</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100a1f"/>
      <stop offset="0.55" stop-color="#17102b"/>
      <stop offset="1" stop-color="#080713"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9333ea"/>
      <stop offset="0.52" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.58 0 0 0 0 0 0.20 0 0 0 0 0 0.92 0 0 0 0 0 0.55 0" result="purpleBlur"/>
      <feMerge>
        <feMergeNode in="purpleBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="840" height="280" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="836" height="276" rx="20" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="720" cy="48" r="78" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="82" cy="236" r="84" fill="#9333ea" opacity="0.12" filter="url(#glow)"/>
  <path d="M34 70H806" stroke="#ffffff" stroke-opacity="0.08"/>
  <path d="M34 210H806" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="34" y="32" width="116" height="30" rx="15" fill="#211336" stroke="#9333ea" stroke-opacity="0.75"/>
  <text x="92" y="52" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PORTFOLIO</text>
  <text x="34" y="112" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Portfolio Website</text>
  <text x="34" y="145" fill="#a78bfa" font-family="Consolas, 'Courier New', monospace" font-size="18">MattVerstappen/mattverstappen.github.io</text>
  <text x="34" y="180" fill="#d8d3e8" font-family="Segoe UI, Arial, sans-serif" font-size="20">My personal portfolio site for game development, research,</text>
  <text x="34" y="206" fill="#d8d3e8" font-family="Segoe UI, Arial, sans-serif" font-size="20">creative coding, web projects, and professional presentation.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="34" y="230" width="66" height="30" rx="15" fill="#2a1740" stroke="#9333ea" stroke-opacity="0.8"/>
    <text x="67" y="250" text-anchor="middle" fill="#f5e8ff">HTML</text>
    <rect x="112" y="230" width="58" height="30" rx="15" fill="#2a1740" stroke="#c026d3" stroke-opacity="0.8"/>
    <text x="141" y="250" text-anchor="middle" fill="#f5e8ff">CSS</text>
    <rect x="182" y="230" width="112" height="30" rx="15" fill="#2a1740" stroke="#38bdf8" stroke-opacity="0.75"/>
    <text x="238" y="250" text-anchor="middle" fill="#f5e8ff">JavaScript</text>
  </g>
</svg>
